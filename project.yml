name: MaccessHub
options:
  bundleIdPrefix: com.maccesshub
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9QBYDAX396

targets:
  MaccessHub:
    type: application
    platform: macOS
    sources:
      - path: Sources/MaccessHub
      # Folder reference: the pack directory is copied into Resources verbatim,
      # so the app can enumerate it exactly like a user pack on disk.
      - path: Resources/Soundpacks
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
    entitlements:
      path: Sources/MaccessHub/MaccessHub.entitlements
      properties:
        # Not sandboxed: global hotkeys, the key-click event tap, and
        # accessibility queries against other apps all need direct access.
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        com.apple.security.device.bluetooth: true
    info:
      path: Sources/MaccessHub/Info.plist
      properties:
        CFBundleDisplayName: MaccessHub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        # Menu bar only: no Dock icon, no app menu.
        LSUIElement: true
        NSHumanReadableCopyright: MIT
        NSAppleEventsUsageDescription: MaccessHub asks VoiceOver to speak messages when VoiceOver is running.
        NSBluetoothAlwaysUsageDescription: MaccessHub plays a sound when Bluetooth devices connect or disconnect.
        NSPrincipalClass: NSApplication
        # Sparkle auto-update. The public key pairs with the EdDSA private key
        # in the release machine's keychain (scripts/package.sh signs with it).
        SUFeedURL: https://raw.githubusercontent.com/masonasons/MaccessHub/main/appcast.xml
        SUPublicEDKey: X8rfcN0/akF3SCG7x6hWOumCBirphh2QSfMecJecws4=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maccesshub.app
        PRODUCT_NAME: MaccessHub
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
